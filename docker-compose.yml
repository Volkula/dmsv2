services:
  api:
    build: ./api
    environment:
      DATA_DIR: /data
      PORT: "8080"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-changeme}"
      BACKUP_DIR: /backups
      ROOM_FILES_MAX: "${ROOM_FILES_MAX:-1073741824}"
    volumes:
      - shirmo-data:/data
      - ./backups:/backups
  caddy:
    image: caddy:2-alpine
    depends_on:
      - api
    ports:
      - "8088:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  shirmo-data:
  caddy-data:
  caddy-config:
